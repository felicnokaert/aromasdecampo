    $('ftx').onsubmit = e => {
      e.preventDefault(); const f = e.target;
      const cambios = data.filter(t => f[t.clave].value.trim() && f[t.clave].value.trim() !== t.valor);
      if (!cambios.length) return aviso('No cambiaste ningún texto.');
      modal(`<h2>¿Guardar estos cambios?</h2><p class="ayuda" style="margin-top:.5rem">Revisá que esté todo bien escrito: así va a aparecer en la web.</p>
        ${cambios.map(t => `<div class="caja" style="margin-bottom:.6rem"><b>${esc(t.grupo)} · ${esc(t.etiqueta)}</b>
          <p style="color:var(--texto2);text-decoration:line-through;margin:.3rem 0">${esc(t.valor)}</p>
          <p style="font-weight:600">${esc(f[t.clave].value.trim())}</p></div>`).join('')}
        <div class="botones"><button class="btn grande" id="si-tx">Sí, guardar cambios</button><button class="btn sec grande" data-cerrar>No, seguir editando</button></div>`, () => {
        $('si-tx').onclick = async () => {
          $('si-tx').disabled = true;
          for (const t of cambios) {
            const valor = f[t.clave].value.trim();
            const { error: er } = await db.from('textos').update({ valor, editado: new Date().toISOString() }).eq('clave', t.clave);
            if (er) { $('si-tx').disabled = false; return error(er); }
            t.valor = valor;
          }
          cerrar(); aviso(cambios.length === 1 ? 'Cambio guardado ✓ Ya se ve en la web.' : cambios.length + ' cambios guardados ✓ Ya se ven en la web.');
        };
      });
    };
  };

  // ======================= LUGARES Y DESCUENTOS =======================
  const CATS_L = { termas: 'Termas', playas: 'Playas', paseos: 'Paseos', historia: 'Historia', naturaleza: 'Naturaleza', comer: 'Para comer', compras: 'Compras' };
  VISTAS.lugares = async () => {
    const { data, error: err } = await db.from('lugares').select('*').order('orden'); if (err) return error(err);
    S.lugares = data || [];
    const v = $('vista');
    v.innerHTML = `<h1 class="titulo">Lugares y descuentos</h1>
      <p class="ayuda">Son los lugares de la Guía de Colón de la web. Sumá restaurantes y comercios, y si tienen un cupón para tus huéspedes, escribilo: sale destacado.</p>
      <button class="btn grande" id="nuevo-l" style="width:100%;margin-bottom:1rem">+ Agregar un lugar</button>
      ${Object.entries(CATS_L).map(([k, t]) => { const ls = S.lugares.filter(l => l.categoria === k); return ls.length ? `<h2 style="margin:1rem 0 .4rem;font-size:1.1rem">${t} (${ls.length})</h2>` +
        ls.map(l => `<div class="caja" style="margin-bottom:.5rem;${l.visible ? '' : 'opacity:.55'}"><div style="display:flex;justify-content:space-between;gap:.6rem;align-items:flex-start">
          <div><b>${esc(l.nombre)}</b>${l.destacado ? ' <small style="color:var(--sol)">· Imperdible</small>' : ''}${l.visible ? '' : ' <small>· oculto</small>'}
          <div style="font-size:.85rem;color:var(--texto2)">${esc([l.localidad, l.distancia].filter(Boolean).join(' · '))}</div>
          ${l.cupon ? `<div style="font-size:.85rem;margin-top:.3rem">🎟 ${esc(l.cupon)}</div>` : ''}</div>
          <button class="btn sec chico" data-edit-l="${l.id}">Editar</button></div></div>`).join('') : ''; }).join('')}`;
    $('nuevo-l').onclick = () => formLugar({ categoria: 'comer', visible: true });
    v.querySelectorAll('[data-edit-l]').forEach(b => b.onclick = () => formLugar(S.lugares.find(l => l.id === Number(b.dataset.editL))));
  };
  function formLugar(l) {
    modal(`<h2>${l.id ? 'Editar lugar' : 'Nuevo lugar'}</h2><form class="form" id="fl">
      <label>Nombre<input name="nombre" value="${esc(l.nombre || '')}" required placeholder="Ej: Parrilla El Fogón"></label>
      <div class="f2"><label>Tipo<select name="categoria">${Object.entries(CATS_L).map(([k, t]) => `<option value="${k}" ${k === l.categoria ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
      <label>Localidad<input name="localidad" value="${esc(l.localidad || '')}" placeholder="Colón"></label></div>
      <label>Qué es / por qué ir<textarea name="descripcion" rows="3" placeholder="Ej: Parrilla de campo, porciones abundantes.">${esc(l.descripcion || '')}</textarea></label>
      <div class="f2"><label>Dirección<input name="direccion" value="${esc(l.direccion || '')}"></label><label>Distancia <small>(ej: 5 min)</small><input name="distancia" value="${esc(l.distancia || '')}"></label></div>
      <label>WhatsApp del lugar <small>(opcional)</small><input name="telefono" inputmode="tel" value="${esc(l.telefono || '')}"></label>
      <label>🎟 Descuento o cupón para huéspedes <small>(opcional)</small><textarea name="cupon" rows="2" placeholder="Ej: 10% presentando la reserva de Aromas de Campo · Código AROMAS10">${esc(l.cupon || '')}</textarea></label>
      <label>Link de Google Maps <small>(opcional: si no, se busca por nombre)</small><input name="maps_url" value="${esc(l.maps_url || '')}" placeholder="https://maps.app.goo.gl/..."></label>
      <label class="check"><input type="checkbox" name="destacado" ${l.destacado ? 'checked' : ''}> Imperdible (sale primero)</label>
      <label class="check"><input type="checkbox" name="visible" ${l.visible !== false ? 'checked' : ''}> Se ve en la web</label>

      ${l.id ? '<button class="btn sec grande" type="button" id="borrar-l" style="color:#B3261E">Borrar lugar</button>' : ''}
      <button class="btn sec grande" type="button" data-cerrar>Cancelar</button></form>`, () => {
      $('fl').onsubmit = async e => {
        e.preventDefault(); const f = e.target, val = n => f[n].value.trim() || null;
        const fila = { nombre: val('nombre'), categoria: f.categoria.value, localidad: val('localidad'), descripcion: val('descripcion'), direccion: val('direccion'),
          distancia: val('distancia'), telefono: val('telefono'), cupon: val('cupon'), maps_url: val('maps_url'), destacado: f.destacado.checked, visible: f.visible.checked };
        if (fila.maps_url && !/^https?:\/\//.test(fila.maps_url)) return aviso('El link de Maps tiene que empezar con https://', true);
        if (!l.id) fila.orden = Math.max(0, ...S.lugares.map(x => x.orden)) + 1;
        const { error: er } = l.id ? await db.from('lugares').update(fila).eq('id', l.id) : await db.from('lugares').insert(fila);
        if (er) return error(er);

        const { error: er } = await db.from('lugares').delete().eq('id', l.id); if (er) return error(er);
        aviso('Lugar borrado'); VISTAS.lugares();
      }, true);
    });
  }

  // ======================= MENSAJES DE WHATSAPP =======================
  const VARIABLES = { nombre: 'nombre del huésped', cabana: 'cabaña', entrada: 'día que llega', salida: 'día que se va', noches: 'noches',
    total: 'total', sena: 'seña', alias: 'alias', cbu: 'CBU', titular: 'titular', codigo: 'código de reserva', checkin: 'hora de entrada',
    checkout: 'hora de salida', ficha: 'link de la ficha de llegada', google: 'link para opinar en Google', web: 'link de la web' };
  function rellenar(texto, r) {
    const a = S.ajustes || {}, n = A.noches(r.entrada, r.salida);
    const datos = { nombre: primerNombre(r), cabana: cabNombre(r.cabana_id), entrada: A.lindo(r.entrada), salida: A.lindo(r.salida), noches: n,
      total: r.total ? A.pesos(r.total) : '', sena: r.sena ? A.pesos(r.sena) : '', alias: a.alias || '', cbu: a.cbu || '', titular: a.titular || '',
      codigo: r.codigo || '', checkin: a.checkin || '12 hs', checkout: a.checkout || '10 hs', ficha: `${web()}/llegada.html?c=${r.codigo || ''}`,
      google: a.google_resena_url || `${web()}/opinar.html?c=${r.codigo || ''}`, web: web() };
    return String(texto).replace(/\{(\w+)\}/g, (m, k) => k in datos ? datos[k] : m);
  }
  const plantilla = (clave, r, porDefecto) => { const m = (S.mensajes || []).find(x => x.clave === clave); return m ? rellenar(m.texto, r) : porDefecto; };
  const linkWa = (r, txt) => `https://wa.me/${telWa(r.telefono)}?text=${encodeURIComponent(txt)}`;
  function elegirMensaje(r) {
    if (!r.telefono) return aviso('Esta reserva no tiene teléfono cargado.', true);

      ${(S.mensajes || []).map(m => `<a class="caja" style="display:block;text-decoration:none;color:inherit;margin-bottom:.5rem" target="_blank" rel="noopener" href="${linkWa(r, rellenar(m.texto, r))}">

  // ======================= GANANCIAS =======================
  const CATS_G = { limpieza: 'Limpieza', luz: 'Luz', gas: 'Gas', agua: 'Agua', internet: 'Internet / cable', arreglos: 'Arreglos', impuestos: 'Impuestos', compras: 'Compras', sueldos: 'Sueldos', publicidad: 'Publicidad', otros: 'Otros' };

  VISTAS.ganancias = async () => {
    const { data: gs, error: err } = await db.from('gastos').select('*').order('fecha', { ascending: false }); if (err) return error(err);

        const a = r.entrada > desde ? r.entrada : desde, b = r.salida <= A.sumar(hasta, 1) ? r.salida : A.sumar(hasta, 1); if (b > a) n += A.noches(a, b); });
      return { c, n, pct: Math.round(n / diasPer * 100) };

        ${Object.keys(porCanal).length ? Object.entries(porCanal).map(([o, v]) => `<div style="display:flex;justify-content:space-between;padding:.35rem 0;border-bottom:1px solid var(--borde)">
          <span>${ORIGENES[o] || o} <small>(${v.n})</small></span><span>${A.pesos(v.t)}${v.c ? ` <small style="color:#B3261E">− ${A.pesos(v.c)}</small>` : ''}</span></div>`).join('') : '<p class="ayuda">Todavía no hay reservas confirmadas en este período.</p>'}
        ${ahorro ? `<p style="margin-top:.6rem;color:var(--verde-osc);font-weight:600">💡 Por reservar directo te ahorraste ${A.pesos(ahorro)} en comisiones.</p>` : ''}</div>
      <div class="caja"><h2>Ocupación</h2>${ocup.map(o => `<div style="margin:.4rem 0"><div style="display:flex;justify-content:space-between"><span>${esc(o.c.nombre)}</span><span>${o.n} de ${diasPer} noches · <b>${o.pct}%</b></span></div>

        ${Object.entries(porCat).sort((a, b) => b[1] - a[1]).map(([c, m]) => `<div style="display:flex;justify-content:space-between;padding:.3rem 0"><span>${CATS_G[c]}</span><b>${A.pesos(m)}</b></div>`).join('') || '<p class="ayuda">No cargaste gastos en este período.</p>'}
        ${lineas.length ? `<details style="margin-top:.6rem"><summary style="cursor:pointer;font-weight:600">Ver el detalle (${lineas.length})</summary>

            <span>${g.fijo ? '🔁 ' : ''}${CATS_G[g.categoria]}${g.nota ? ' · ' + esc(g.nota) : ''}<br><small>${g.fijo ? 'Fijo todos los meses' : A.corto(g.fecha)}</small></span>
            <span style="text-align:right">${A.pesos(g.monto)}<br><button class="btn sec chico" data-edit-g="${g.id}">Editar</button></span></div>`).join('')}</details>` : ''}</div>
      <div class="caja"><h2>Comisiones de las plataformas</h2><form class="form" id="fcom"><div class="f2">
        <label>Booking %<input type="number" step="0.1" min="0" max="40" name="b" value="${S.ajustes.comision_booking_pct ?? 15}"></label>
        <label>Airbnb %<input type="number" step="0.1" min="0" max="40" name="a" value="${S.ajustes.comision_airbnb_pct ?? 15.5}"></label></div>

    $('fa').onclick = () => { if (S.fin.modo === 'anio') S.fin.anio--; else if (--S.fin.mes < 0) { S.fin.mes = 11; S.fin.anio--; } VISTAS.ganancias(); };

    v.querySelectorAll('[data-res]').forEach(b => b.onclick = () => formReserva(S.reservas.find(r => r.id === Number(b.dataset.res))));
    $('nuevo-g').onclick = () => formGasto({ fecha: A.hoy(), categoria: 'limpieza' });

    $('fcom').onsubmit = async e => { e.preventDefault();
      const c = { comision_booking_pct: Number(e.target.b.value) || 0, comision_airbnb_pct: Number(e.target.a.value) || 0 };

  function formGasto(g) {

  // ======================= HUÉSPEDES =======================
  VISTAS.huespedes = () => {

      h.visitas++; h.noches += A.noches(r.entrada, r.salida); h.total += Number(r.total || 0); h.origenes.add(ORIGENES[r.origen] || r.origen);
      if (r.entrada > h.ultima) { h.ultima = r.entrada; h.nombre = r.nombre || h.nombre; h.email = r.email || h.email; } h.res.push(r); mapa.set(k, h);

  // ======================= SUGERENCIAS DE PRECIO =======================
  function sugerencias() {
    const hoy = A.hoy(), out = [];
    const activas = S.cabanas.filter(c => c.activa);
    const ocupada = (cid, f) => S.reservas.some(r => r.cabana_id === cid && (r.estado === 'confirmada' || r.estado === 'bloqueo') && r.entrada <= f && r.salida > f);
    // 1) demanda: fechas libres con 2 o más pedidos en los últimos 30 días
    const desde30 = new Date(Date.now() - 30 * 864e5).toISOString();
    const pedidos = S.reservas.filter(r => r.origen === 'web' && r.creada >= desde30 && r.salida > hoy && ['pendiente', 'cancelada'].includes(r.estado));
    const cuenta = {};
    pedidos.forEach(r => { for (let f = r.entrada; f < r.salida; f = A.sumar(f, 1)) cuenta[f] = (cuenta[f] || 0) + 1; });
    const calientes = Object.keys(cuenta).filter(f => cuenta[f] >= 2 && activas.some(c => !ocupada(c.id, f))).sort();
    if (calientes.length) out.push({ t: '🔥 Mucha demanda', d: `Hubo ${Math.max(...calientes.map(f => cuenta[f]))} pedidos para fechas como el ${A.lindo(calientes[0])} y todavía hay lugar. Podés subirles el precio en "Precios especiales".` });
    // 2) noches libres en los próximos 7 días
    let libres7 = 0; for (let i = 0; i < 7; i++) { const f = A.sumar(hoy, i); activas.forEach(c => { if (!ocupada(c.id, f)) libres7++; }); }
    if (libres7 >= 4 && !(Number(S.ajustes.ultimo_minuto_pct) > 0)) out.push({ t: '⏰ Noches libres esta semana', d: `Quedan ${libres7} noches libres en los próximos 7 días. Activá un descuento de último minuto (Ajustes) para llenarlas.` });
    // 3) ocupación de los próximos 30 días
    let occ = 0, tot = 0; for (let i = 0; i < 30; i++) { const f = A.sumar(hoy, i); activas.forEach(c => { tot++; if (ocupada(c.id, f)) occ++; }); }
    const pct = tot ? Math.round(occ / tot * 100) : 0;
    if (pct < 25) out.push({ t: '📉 Mes tranquilo', d: `Los próximos 30 días están ocupados al ${pct}%. Buen momento para mandarle una promo a los huéspedes que ya vinieron (Más → Huéspedes).` });

    return out;
  }


  // ---------- Precios en Airbnb y Booking: comparación y alertas ----------
  async function dolarHoy() {
    if (S.dolar && Date.now() - S.dolar.t < 36e5) return S.dolar;
    try {
      const r = await fetch('https://dolarapi.com/v1/dolares/oficial'); const d = await r.json();
      if (d && d.venta) return (S.dolar = { v: Number(d.venta), fuente: 'dólar oficial (venta) de hoy', t: Date.now() });
    } catch (e) { /* sin internet o la página del dólar no responde */ }
    const m = Number(S.ajustes.cotizacion_usd);
    return m ? { v: m, fuente: 'cotización cargada a mano', t: 0 } : null;
  }
  const dec = n => String(n).replace('.', ',');
  function analisisPlataformas(dol) {
    const aj = S.ajustes, c = S.cabanas.find(x => x.activa) || {};
    const web2 = Number(c.precio_base) || 0, web4 = p4(web2, c.extra_persona);
    const comA = Number(aj.comision_airbnb_pct ?? 15.5), comB = Number(aj.comision_booking_pct ?? 15);
    const filas = [
      { n: 'Web (directo)', p2: web2, p4: web4, com: 0 },
      { n: 'Airbnb', usd2: aj.airbnb_usd_2, usd4: aj.airbnb_usd_4, com: comA },
      { n: 'Booking', usd2: aj.booking_usd_2, usd4: aj.booking_usd_4, com: comB }
    ];
    filas.forEach(f => { if (f.usd2 != null && dol) { f.p2 = Math.round(Number(f.usd2) * dol); f.p4 = Math.round(Number(f.usd4 ?? f.usd2) * dol); }
      f.neto2 = f.p2 != null ? Math.round(f.p2 * (1 - f.com / 100)) : null; f.neto4 = f.p4 != null ? Math.round(f.p4 * (1 - f.com / 100)) : null; });
    const alertas = [];
    if (!dol) alertas.push({ t: '💵 Falta el dólar', d: 'No se pudo leer el dólar de hoy. Cargalo a mano abajo para poder comparar.' });
    else filas.slice(1).forEach(f => {
      if (f.usd2 == null) return;
      const ideal = Math.ceil(web2 / (1 - f.com / 100) / dol);
      if (f.p2 < web2) alertas.push({ t: `⚠️ En ${f.n} el huésped paga menos que en la web`, d: `Paga ${A.pesos(f.p2)} contra ${A.pesos(web2)} en la web. Así nadie reserva directo. Subilo a USD ${ideal} o más.` });
      else if (f.neto2 < web2) alertas.push({ t: `💸 En ${f.n} te queda menos que por la web`, d: `Después de la comisión (${dec(f.com)}%) te quedan ${A.pesos(f.neto2)} por noche, contra ${A.pesos(web2)} por la web. Para cubrir la comisión, el precio debería ser USD ${ideal}.` });
    });
    const zona = [['Booking', aj.booking_usd_2, aj.booking_mediana_usd, 'la mitad de los alojamientos parecidos de la zona cobra menos que eso'], ['Airbnb', aj.airbnb_usd_2, aj.airbnb_sugerido_usd, 'es el precio que sugiere Airbnb']];
    zona.forEach(([n, mio, ref, que]) => { if (mio && ref) { const x = Number(mio) / Number(ref);
      if (x >= 1.8) alertas.push({ t: `📊 ${n}: estás ${x.toFixed(1).replace('.', ',')} veces arriba de la zona`, d: `Cobrás USD ${dec(mio)} y la referencia es USD ${dec(ref)} (${que}). Un anuncio nuevo y sin reseñas con ese precio aparece poco en las búsquedas. Probá unas semanas con la promo de anuncio nuevo o un precio más cerca de la referencia hasta tener las primeras reseñas.` });
      else if (x < 0.8) alertas.push({ t: `📊 ${n}: estás por debajo de la zona`, d: `Cobrás USD ${dec(mio)} y la referencia es USD ${dec(ref)}. Podrías subirlo un poco.` }); } });
    return { filas, alertas, web2 };
  }

        <label>Email para avisos de reservas nuevas <small>(podés poner varios separados por coma)</small><input name="email_avisos" value="${esc(a.email_avisos || '')}"></label>
        <h2 style="margin-top:.6rem">⭐ Google</h2>
        <div class="f2"><label>Puntaje en Google<input type="number" name="google_puntaje" value="${a.google_puntaje ?? ''}" min="1" max="5" step="0.1"></label>
        <label>Cantidad de opiniones<input type="number" name="google_cantidad" value="${a.google_cantidad ?? ''}" min="0"></label></div>
        <label>Link a las opiniones de Google<input name="google_url" value="${esc(a.google_url || '')}"></label>
        <label>Aviso arriba de la web <small>(opcional, ej: "¡Últimas fechas para enero!")</small><input name="aviso" value="${esc(a.aviso || '')}" maxlength="140"></label>
        <button class="btn grande">Guardar</button></form>
      <div class="caja"><h2>Tu cuenta</h2><button class="btn sec" id="cambiar-pass">Cambiar mi contraseña</button></div>`;
    $('fa').onsubmit = async e => {
      e.preventDefault(); const v = Object.fromEntries(new FormData(e.target));
      const fila = { alias: v.alias.trim() || null, cbu: v.cbu.trim() || null, titular: v.titular.trim() || null, sena_pct: Number(v.sena_pct), checkin: v.checkin.trim() || '14 hs', checkout: v.checkout.trim() || '11 hs',
                     whatsapp: v.whatsapp.replace(/\D/g, '') || '5491169495055', aviso: v.aviso.trim() || null, email_avisos: v.email_avisos.trim() || null,
                     ultimo_minuto_pct: Number(v.ultimo_minuto_pct) || 0, ultimo_minuto_dias: Number(v.ultimo_minuto_dias) || 3,
                     info_llegada: v.info_llegada.trim() || null, resumen_semanal: !!v.resumen_semanal,
                     google_puntaje: v.google_puntaje ? Number(v.google_puntaje) : null, google_cantidad: v.google_cantidad ? Number(v.google_cantidad) : null,
                     google_url: v.google_url.trim() || null };
      const { error: err } = await db.from('ajustes').update(fila).eq('id', true); if (err) return error(err);
      Object.assign(S.ajustes, fila); aviso('Guardado ✓');
    };
    $('cambiar-pass').onclick = () => modal(`<h2>Cambiar contraseña</h2><form class="form" id="fcp"><label>Contraseña nueva <small>(mínimo 8 letras o números)</small><input type="password" name="p" minlength="8" required></label><button class="btn grande">Guardar</button><button class="btn sec grande" type="button" data-cerrar>Cancelar</button></form>`, () => {
      $('modal-raiz').querySelector('[data-cerrar]').onclick = cerrar;
      $('fcp').onsubmit = async e => { e.preventDefault(); const { error: err } = await db.auth.updateUser({ password: e.target.p.value }); if (err) return error(err); cerrar(); aviso('Contraseña cambiada ✓'); };
    });
  };

  // ---------- Booking y Airbnb ----------
  VISTAS.sync = () => {
    const PLAT = { booking: 'Booking.com', airbnb: 'Airbnb' };
    const hace = f => { if (!f) return 'nunca'; const m = Math.round((Date.now() - new Date(f)) / 60000); return m < 1 ? 'recién' : m < 60 ? `hace ${m} min` : m < 1440 ? `hace ${Math.round(m / 60)} h` : new Date(f).toLocaleDateString('es-AR'); };
    $('vista').innerHTML = `<h1 class="titulo">Booking y Airbnb</h1>
      <p class="ayuda">Para cada cabaña hay que hacer 2 cosas en cada plataforma: <b>1)</b> copiar <b>nuestro link</b> y pegarlo allá en "Importar calendario". <b>2)</b> copiar <b>el link de ellos</b> ("Exportar calendario") y pegarlo acá. Desde ese momento se sincroniza solo cada 30 minutos.</p>
      <details class="caja guia-sync"><summary><b>¿Dónde encuentro los links en Airbnb y Booking?</b></summary>
        <h3>Airbnb</h3><ol><li>Entrá a Airbnb en modo anfitrión → <b>Calendario</b> y elegí la cabaña.</li>
          <li>Tocá <b>Disponibilidad</b> → <b>Conectar calendarios</b> (o "Sincronizar calendarios").</li>
          <li><b>Exportar calendario:</b> copiá ese link y pegalo acá abajo, en el paso 2.</li>
          <li><b>Importar calendario:</b> pegá nuestro link (paso 1) y ponele de nombre "Web Aromas".</li></ol>
        <h3>Booking</h3><ol><li>Entrá a la extranet de Booking → <b>Tarifas y disponibilidad</b> → <b>Sincronizar calendarios</b>.</li>
          <li>Elegí la casa (Olivia o Sofía) y tocá <b>Conectar calendario</b>.</li>
          <li>Pegá nuestro link (paso 1) donde dice <b>importar</b>, y copiá el link de <b>exportar</b> de Booking para pegarlo acá (paso 2).</li></ol>
        <p class="vacio">Los mensajes de los huéspedes de Airbnb y Booking se siguen contestando desde sus apps: esas plataformas no dejan traerlos a otro lado.</p></details>
      <button class="btn grande" id="sync-ya" style="margin-bottom:1rem">🔄 Sincronizar ahora</button>
      ${S.cabanas.filter(c => c.activa).map(c => `<div class="caja"><h2>${esc(c.nombre)}</h2>${Object.entries(PLAT).map(([k, nom]) => {
        const ce = S.calExt.find(x => x.cabana_id === c.id && x.plataforma === k);
        const link = `${web()}/cal/${k}/${c.ical_token}.ics`;
        return `<div class="plat"><h3>${nom}</h3>
          <label>1. Nuestro link → pegalo en ${nom}</label>
          <div class="link-copiar"><input readonly value="${link}" aria-label="Link para ${nom}"><button class="btn sec chico" data-copiar="${link}">Copiar</button></div>
          <form class="form" data-cab="${c.id}" data-plat="${k}"><label>2. El link de ${nom} → pegalo acá
            <input name="url" type="url" value="${esc(ce ? ce.url : '')}" placeholder="https://… .ics"></label>
            <div class="botones" style="margin:0"><button class="btn chico">Guardar</button>${ce ? `<button type="button" class="btn rojo chico" data-quitar="${ce.id}">Desconectar</button>` : ''}</div></form>
          ${ce ? `<p class="estado-sync ${ce.ultimo_error ? 'mal' : 'ok'}" style="margin-top:.5rem">${ce.ultimo_error ? '⚠️ ' + esc(ce.ultimo_error) : '✓ Conectado'} · última sincronización: ${hace(ce.ultima_sync)}${ce.eventos != null ? ` · ${ce.eventos} fechas leídas` : ''}</p>` : '<p class="estado-sync">Sin conectar</p>'}
        </div>`; }).join('')}</div>`).join('')}`;
    const v = $('vista');
    v.querySelectorAll('[data-copiar]').forEach(b => b.onclick = () => navigator.clipboard.writeText(b.dataset.copiar).then(() => { b.textContent = '¡Copiado!'; setTimeout(() => b.textContent = 'Copiar', 1800); }));
    v.querySelectorAll('form[data-cab]').forEach(f => f.onsubmit = async e => {
      e.preventDefault(); const url = f.url.value.trim();
      if (!/^https:\/\/.+/i.test(url)) return aviso('Pegá el link completo, empieza con https://', true);
      const fila = { cabana_id: Number(f.dataset.cab), plataforma: f.dataset.plat, url };
      const ce = S.calExt.find(x => x.cabana_id === fila.cabana_id && x.plataforma === fila.plataforma);
      const q = ce ? db.from('calendarios_externos').update({ url, ultimo_error: null }).eq('id', ce.id).select().single() : db.from('calendarios_externos').insert(fila).select().single();
      const { data, error: err } = await q; if (err) return error(err);
      if (ce) Object.assign(ce, data); else S.calExt.push(data);
      aviso('Guardado ✓ Sincronizando…'); sincronizar();
    });
    v.querySelectorAll('[data-quitar]').forEach(b => b.onclick = () => confirmar('¿Desconectar este calendario?', 'Sí, desconectar', async () => {
      const { error: err } = await db.from('calendarios_externos').delete().eq('id', Number(b.dataset.quitar)); if (err) return error(err);
      S.calExt = S.calExt.filter(x => x.id !== Number(b.dataset.quitar)); VISTAS.sync();
    }, true));
    $('sync-ya').onclick = sincronizar;
  };
  async function sincronizar() {
    const b = $('sync-ya'); if (b) { b.disabled = true; b.textContent = '🔄 Sincronizando…'; }
    try {
      const r = await fetch(window.AROMAS_CONFIG.url + '/functions/v1/sincronizar', { method: 'POST', headers: { apikey: window.AROMAS_CONFIG.key, Authorization: 'Bearer ' + window.AROMAS_CONFIG.key } });
      const d = await r.json();
      const nuevas = (d.calendarios || []).reduce((n, c) => n + (c.nuevas || 0), 0), errores = (d.calendarios || []).filter(c => c.error).length;
      aviso(errores ? `Hubo problemas con ${errores} calendario(s). Mirá el detalle abajo.` : `Sincronizado ✓ ${nuevas ? nuevas + ' fechas nuevas' : 'sin cambios'}`, !!errores);
    } catch (e) { aviso('No se pudo sincronizar ahora. Se va a intentar solo en un rato.', true); }
    await cargarTodo(); if (S.vista === 'sync') VISTAS.sync();
  }

  // ---------- Reseñas ----------
  VISTAS.resenas = (verPub) => {
    const lista = (S.resenas || []).filter(r => verPub ? r.aprobada : !r.aprobada);
    const est = n => '★'.repeat(n) + '☆'.repeat(5 - n);
    $('vista').innerHTML = `<h1 class="titulo">Reseñas</h1>
      <p class="ayuda">Las reseñas que dejan los huéspedes llegan acá. Solo aparecen en la web las que vos publicás. Responderlas muestra que hay alguien atento del otro lado.</p>
      <div class="filtros"><button class="${verPub ? '' : 'act'}" data-pub="0">Para revisar (${S.resenas.filter(r => !r.aprobada).length})</button><button class="${verPub ? 'act' : ''}" data-pub="1">Publicadas (${S.resenas.filter(r => r.aprobada).length})</button></div>
      <div class="caja">${lista.length ? lista.map(r => `<div class="resena"><div class="estrellas" aria-label="${r.estrellas} estrellas">${est(r.estrellas)}</div>
        <p style="margin:.3rem 0">"${esc(r.texto)}"</p><small class="vacio">${esc(r.nombre)}${r.ciudad ? ' · ' + esc(r.ciudad) : ''}${r.cabana_id ? ' · ' + esc(cabNombre(r.cabana_id)) : ''} · ${r.fuente} · ${new Date(r.creada).toLocaleDateString('es-AR')}</small>
        ${r.respuesta ? `<p style="background:var(--beige);padding:.6rem;border-radius:10px;margin-top:.5rem">💬 <b>Respuesta:</b> ${esc(r.respuesta)}</p>` : ''}
        <div class="botones">${r.aprobada ? `<button class="btn sec chico" data-ap="${r.id}" data-val="0">Ocultar de la web</button>` : `<button class="btn chico" data-ap="${r.id}" data-val="1">✓ Publicar en la web</button>`}
        <button class="btn sec chico" data-resp="${r.id}">💬 Responder</button><button class="btn rojo chico" data-borrar="${r.id}">🗑</button></div></div>`).join('') : '<p class="vacio">No hay reseñas acá todavía.</p>'}
      <button class="btn grande" style="margin-top:1rem" id="nueva-r">＋ Cargar una reseña de Google, Booking, etc.</button></div>`;
    const v = $('vista');
    v.querySelectorAll('[data-pub]').forEach(b => b.onclick = () => VISTAS.resenas(b.dataset.pub === '1'));
    const actualizar = async (id, cambios, msg) => { const { error: err } = await db.from('resenas').update(cambios).eq('id', id); if (err) return error(err); Object.assign(S.resenas.find(x => x.id === id), cambios); aviso(msg); VISTAS.resenas(verPub); };
    v.querySelectorAll('[data-ap]').forEach(b => b.onclick = () => actualizar(Number(b.dataset.ap), { aprobada: b.dataset.val === '1' }, b.dataset.val === '1' ? 'Publicada en la web ✓' : 'Oculta ✓'));
    v.querySelectorAll('[data-resp]').forEach(b => b.onclick = () => { const r = S.resenas.find(x => x.id === Number(b.dataset.resp));
      modal(`<h2>Responder a ${esc(r.nombre)}</h2><form class="form" id="fres"><label>Tu respuesta <small>(se ve en la web debajo de la reseña)</small><textarea name="t" rows="4">${esc(r.respuesta || '')}</textarea></label><button class="btn grande">Guardar</button><button class="btn sec grande" type="button" data-cerrar>Cancelar</button></form>`, () => {
        $('modal-raiz').querySelector('[data-cerrar]').onclick = cerrar;
        $('fres').onsubmit = e => { e.preventDefault(); cerrar(); actualizar(r.id, { respuesta: e.target.t.value.trim() || null }, 'Respuesta guardada ✓'); };
      }); });
    v.querySelectorAll('[data-borrar]').forEach(b => b.onclick = () => confirmar('¿Borrar esta reseña?', 'Sí, borrar', async () => {
      const id = Number(b.dataset.borrar); const { error: err } = await db.from('resenas').delete().eq('id', id); if (err) return error(err);
      S.resenas = S.resenas.filter(x => x.id !== id); VISTAS.resenas(verPub); }, true));
    $('nueva-r').onclick = () => {
      let estrellas = 5;
      modal(`<h2>Cargar una reseña</h2><p class="ayuda">Para pasar acá opiniones reales que les dejaron en Google, Booking, Airbnb o por WhatsApp.</p><form class="form" id="fnr">
        <div class="sel-estrellas" id="se">${[1, 2, 3, 4, 5].map(n => `<button type="button" data-n="${n}" class="on" aria-label="${n} estrellas">★</button>`).join('')}</div>
        <label>Nombre<input name="nombre" required></label><label>Ciudad <small>(opcional)</small><input name="ciudad"></label>
        <label>Qué dijo<textarea name="texto" rows="4" required></textarea></label>
        <div class="f2"><label>Cabaña<select name="cab"><option value="">—</option>${S.cabanas.map(c => `<option value="${c.id}">${esc(c.nombre)}</option>`).join('')}</select></label>
        <label>De dónde<select name="fuente">${['google', 'booking', 'airbnb', 'whatsapp', 'otra'].map(f => `<option>${f}</option>`).join('')}</select></label></div>
        <button class="btn grande">Guardar y publicar</button><button class="btn sec grande" type="button" id="otra-r">Guardar y cargar otra</button><button class="btn sec grande" type="button" data-cerrar>Cancelar</button></form>`, () => {
        $('modal-raiz').querySelector('[data-cerrar]').onclick = cerrar;
        $('otra-r').onclick = () => { S.otraResena = true; $('fnr').requestSubmit(); };
        $('se').querySelectorAll('button').forEach(b => b.onclick = () => { estrellas = Number(b.dataset.n); $('se').querySelectorAll('button').forEach(x => x.classList.toggle('on', Number(x.dataset.n) <= estrellas)); });
        $('fnr').onsubmit = async e => { e.preventDefault(); const v = Object.fromEntries(new FormData(e.target));
          const { data, error: err } = await db.from('resenas').insert({ nombre: v.nombre.trim(), ciudad: v.ciudad.trim() || null, texto: v.texto.trim(), estrellas,
            cabana_id: v.cab ? Number(v.cab) : null, fuente: v.fuente, aprobada: true }).select().single();
          if (err) { S.otraResena = false; return error(err); } S.resenas.unshift(data);
          if (S.otraResena) { S.otraResena = false; aviso('Guardada ✓ Cargá la siguiente'); const f = $('fnr'), fu = f.fuente.value; f.reset(); f.fuente.value = fu; f.nombre.focus(); return; }
          cerrar(); aviso('Reseña publicada ✓'); VISTAS.resenas(true); };
      });
    };
  };

  arrancar();
})();
</script>
</body>
</html>
